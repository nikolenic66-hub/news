name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile application, migrations, and tests
        run: python -m compileall -q app migrations tests
      - name: Validate Alembic configuration
        run: python -m alembic heads
      - name: Render migration SQL without connecting to a live database
        env:
          DATABASE_URL: postgresql://news:news@localhost/news
        run: python -m alembic upgrade --sql head
      - name: Run tests
        run: python -m pytest -q
